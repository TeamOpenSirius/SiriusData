name: .NET build and package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: 'Optional NuGet version (for example 1.2.3).'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.value }}

    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        # A workflow_call originates in the consuming repository. Build the
        # SiriusData checkout in that case; normal events use their own ref.
        repository: ${{ github.event_name == 'workflow_call' && 'TeamOpenSirius/SiriusData' || github.repository }}
        ref: ${{ github.event_name == 'workflow_call' && 'main' || github.ref }}
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Resolve package version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.package-version }}
        TAG_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        if [[ -n "$INPUT_VERSION" ]]; then
          version="$INPUT_VERSION"
        elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version="${TAG_NAME#v}"
        else
          version="1.0.0-ci.${RUN_NUMBER}"
        fi
        echo "value=$version" >> "$GITHUB_OUTPUT"
        echo "Building Sirius.Protocol $version"
    - name: Restore dependencies
      run: dotnet restore SiriusData.sln
    - name: Build
      run: dotnet build SiriusData.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test SiriusData.sln --configuration Release --no-build --verbosity normal
    - name: Pack Sirius.Protocol
      run: >-
        dotnet pack src/Sirius.Protocol/Sirius.Protocol.csproj
        --configuration Release
        --no-build
        --output artifacts/packages
        -p:PackageVersion=${{ steps.version.outputs.value }}
        -p:IncludeSymbols=true
        -p:SymbolPackageFormat=snupkg
    - name: Pack Sirius.MasterData
      run: >-
        dotnet pack src/Sirius.MasterData/Sirius.MasterData.csproj
        --configuration Release
        --no-build
        --output artifacts/packages
        -p:PackageVersion=${{ steps.version.outputs.value }}
        -p:IncludeSymbols=true
        -p:SymbolPackageFormat=snupkg
    - name: Collect build outputs
      shell: bash
      run: |
        mkdir -p artifacts/binaries
        cp -R src/Sirius.Protocol/bin/Release/net10.0 artifacts/binaries/net10.0
        cp -R src/Sirius.MasterData/bin/Release/net10.0 artifacts/binaries/masterdata-net10.0
    - name: Upload packages and binaries
      uses: actions/upload-artifact@v4
      with:
        name: siriusdata-${{ steps.version.outputs.value }}
        path: |
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
          artifacts/binaries
        if-no-files-found: error
        retention-days: 30
    - name: Publish packages to GitHub Packages
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for package in artifacts/packages/*.nupkg; do
          dotnet nuget push "$package" \
            --source https://nuget.pkg.github.com/TeamOpenSirius/index.json \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate
        done
